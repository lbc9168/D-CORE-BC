[project]
name = "bri-re-pipeline"
version = "0.1.0"
description = "BRI RE Database — Full Pipeline Orchestration (pure Python)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "s01a_news_crawler",
    "s01b_project_extractor",
    "s02a_duplicate_merger",
    "s02b_entity_normalizer",
    "s02c_cross_verification",
    "s02e_source_finder",
    "s03_data_exporter",
]

[project.scripts]
run_pipeline    = "bri_pipeline.flow:run_full_pipeline"
run_from_s01b   = "bri_pipeline.flow:run_from_s01b"
run_export_only = "bri_pipeline.flow:run_export_only"

[tool.uv.sources]
s01a_news_crawler      = { path = "../s01a_news_crawler",      editable = true }
s01b_project_extractor = { path = "../s01b_project_extractor", editable = true }
s02a_duplicate_merger  = { path = "../s02a_duplicate_merger",  editable = true }
s02b_entity_normalizer = { path = "../s02b_entity_normalizer", editable = true }
s02c_cross_verification = { path = "../s02c_cross_verification", editable = true }
s02e_source_finder     = { path = "../s02e_source_finder",     editable = true }
s03_data_exporter      = { path = "../s03_data_exporter",      editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bri_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
extraPaths = [
    "../s01a_news_crawler/src",
    "../s01b_project_extractor/src",
    "../s02a_duplicate_merger/src",
    "../s02b_entity_normalizer/src",
    "../s02c_cross_verification/src",
    "../s02e_source_finder/src",
    "../s03_data_exporter/src",
]
