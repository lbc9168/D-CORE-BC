[project]
name = "s01a_news_crawler"
version = "0.1.0"
description = "BRI RE Database Stage 1A - News Crawler using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]==1.9.3",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
s01a_news_crawler = "s01a_news_crawler.main:run"
run_crew           = "s01a_news_crawler.main:run"
run_bulk_crawl     = "s01a_news_crawler.main:run_bulk_crawl"
train              = "s01a_news_crawler.main:train"
replay             = "s01a_news_crawler.main:replay"
test               = "s01a_news_crawler.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
