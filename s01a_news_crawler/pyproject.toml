[project]
name = "s01a_news_crawler"
version = "0.1.0"
description = "BRI RE Database Stage 1A - News Crawler (pure Python)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
s01a_news_crawler = "s01a_news_crawler.main:run"
run_bulk_crawl     = "s01a_news_crawler.main:run_bulk_crawl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
