crawl_news_task:
  description: >
    使用新闻爬取工具，从新闻源 {source_url} 抓取 {start_date} 至 {end_date} 期间的新闻文章。
    关键词过滤条件（正文包含任意一个即保留）：{keywords}。
    将符合条件的新闻保存到 raw_news.db 数据库中，存放于 data/ 目录下。
    完成后报告最终保存的文件完整路径和抓取到的新闻数量。
  expected_output: >
    一段文字摘要，包含：成功保存的数据库文件路径，以及抓取并保留的新闻总条数。
    例如："采集完成。共抓取 127 条符合条件的新闻。数据已保存至：/path/to/data/raw_news.db"
  agent: news_crawler
