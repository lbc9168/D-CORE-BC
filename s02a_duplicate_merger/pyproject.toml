[project]
name = "s02a_duplicate_merger"
version = "0.1.0"
description = "BRI RE Database Stage 2A - Deduplication & Storage using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai]==1.9.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.49.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
]

[project.scripts]
s02a_duplicate_merger = "s02a_duplicate_merger.main:run"
run_crew              = "s02a_duplicate_merger.main:run"
normalize_entities    = "s02a_duplicate_merger.entity_normalizer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
