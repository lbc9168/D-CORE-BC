merge_and_store_task:
  description: >
    从 s01 提取结果数据库 {input_db} 中读取所有 imported_to_s02a=0 的未处理记录，
    执行五阶段去重合并流程：
    1. 候选筛查：按国家、类别、装机容量和项目名称模糊匹配找潜在重复对；
    2. LLM 确认：调用 AI 判断候选对是否为同一项目；
    3. 字段仲裁：LLM 解决冲突字段，合并中方实体列表；
    4. SQLite 写入：规范化数据入库（三张关系表）；
    5. 标记已导入：将处理过的记录在 projects.db 中标记为 imported_to_s02a=1。
    最终将去重后的项目数据写入 {db_path}。
  expected_output: >
    处理完成摘要，包含：原始行数、逻辑项目数、去重候选对数、入库项目事件数，
    以及新建 canonical_projects / project_events / chinese_entities 各自的数量，
    和数据库文件的完整路径。
  agent: data_verifier
