cross_verify_task:
  description: >
    对 {db_path} 数据库中所有 verification_status 为 'unverified' 的项目事件执行外部交叉验证：
    1. GDELT 查询：按国家×能源类型从 GDELT 拉取过去 {gdelt_months} 个月的国际新闻标题，
       结果缓存至 {cache_dir}，避免重复查询；
    2. 向量匹配：使用 Gemini text-embedding-004 对项目和文章分别做多语言嵌入，
       筛出余弦相似度 ≥ {similarity_threshold} 的候选对；
    3. LLM 确认：调用 AI 逐对确认文章是否报道该项目，输出置信度（high/medium/low）；
    4. 写回数据库：已验证记录更新 verification_status 和 verification_sources；
       低置信度记录设置 needs_manual_review=1，并导出 Excel 人工核查清单至 {output_dir}。
  expected_output: >
    验证完成摘要，包含：待验证项目数、GDELT 文章总数、候选对数、
    已验证数量、待人工核查数量、未匹配数量，以及人工核查清单的文件路径（若存在）。
  agent: cross_verifier
