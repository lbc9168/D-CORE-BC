[project]
name = "s02b_entity_normalizer"
version = "0.1.0"
description = "BRI RE Database Stage 2B - Chinese Entity Name Normalization"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-genai>=1.49.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
s02b_entity_normalizer = "s02b_entity_normalizer.entity_normalizer:run"
normalize_entities     = "s02b_entity_normalizer.entity_normalizer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
