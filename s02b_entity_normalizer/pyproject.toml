[project]
name = "s02b_entity_normalizer"
version = "0.1.0"
description = "BRI RE Database Stage 2B - Chinese Entity Name Normalization"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-genai>=1.49.0",
    "rapidfuzz>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
s02b_entity_normalizer = "s02b_entity_normalizer.entity_normalizer:run"
normalize_entities     = "s02b_entity_normalizer.entity_normalizer:run"
normalize_locations    = "s02b_entity_normalizer.location_normalizer:run"
normalize_developers   = "s02b_entity_normalizer.developer_normalizer:run"
backfill_entity_en     = "s02b_entity_normalizer.en_backfill:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
