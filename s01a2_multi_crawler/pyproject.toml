[project]
name = "s01a2_multi_crawler"
version = "0.1.0"
description = "多源新闻爬虫与监控（v3 试点：6 个 Tier-1 站点增量爬取）"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "playwright>=1.40",  # headless 渲染（过瑞数类反爬墙）；浏览器本体需另跑 `playwright install chromium`
    "google-genai>=1.0",  # 初筛 LLM 判定（gemini-2.5-flash-lite）
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crawl = "s01a2_multi_crawler.main:main_crawl"
health-report = "s01a2_multi_crawler.main:main_health"
filter = "s01a2_multi_crawler.filter:main_filter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s01a2_multi_crawler"]
