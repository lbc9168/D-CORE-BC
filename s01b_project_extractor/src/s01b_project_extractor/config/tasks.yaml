extract_projects_task:
  description: >
    从 raw_news.db 数据库中读取已爬取的新闻数据（数据库路径：{raw_news_db_path}），
    对每篇新闻进行 AI 智能分析，识别并提取其中涉及中国企业参与的海外可再生能源项目信息。
    将结果分三类写入 SQLite 数据库：
      1. 有效项目（含中方参与的可再生能源电站项目）→ projects_db_path: {projects_db_path}
      2. 无中方参与项目 → review_db_path: {review_db_path}
      3. 被剔除无关新闻（制造厂、输变电、化石能源等）→ review_db_path: {review_db_path}
    同时保存所有 AI 分析原始结果的 JSON 文件（存放在 projects.db 同级目录）。
    完成后报告各类别的数量摘要。
  expected_output: >
    一段文字摘要，包含：各分类的条目数量以及数据库路径。
    例如：
    "提取完成。
      有效项目:   43 条 → /path/to/data/projects.db
      无中方参与: 12 条 → /path/to/data/review.db
      被剔除新闻: 72 条 → /path/to/data/review.db
      AI原始结果: 127 条 → /path/to/data/All_AI_Results_20260301_1500.json"
  agent: project_extractor
