[project]
name = "s01b_project_extractor"
version = "0.1.0"
description = "BRI RE Database Stage 1B - Project Extractor with Quality Guardrails"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.49.0",
    "openai>=1.0.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
s01b_project_extractor = "s01b_project_extractor.main:run"
run_bulk_extract       = "s01b_project_extractor.main:run_bulk_extract"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src"/"tests" 在前确保 s01b_project_extractor 包从 src 解析（不被根同名目录遮蔽）；
# ".." 指向仓库根，使 bri_enums/bri_parse/review 等根模块可被 s01b 测试导入。
pythonpath = ["src", "tests", ".."]
addopts = "-v --tb=short"
