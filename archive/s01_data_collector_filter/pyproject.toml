[project]
name = "s01_data_collector_filter"
version = "0.1.0"
description = "BRI RE Database Stage 1 - Data Collection & Filter using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai]==1.9.3",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.49.0",
]

[project.scripts]
s01_data_collector_filter = "s01_data_collector_filter.main:run"
run_crew                  = "s01_data_collector_filter.main:run"
run_parallel              = "s01_data_collector_filter.main:run_parallel"
run_bulk                  = "s01_data_collector_filter.main:run_bulk"
train                     = "s01_data_collector_filter.main:train"
replay                    = "s01_data_collector_filter.main:replay"
test                      = "s01_data_collector_filter.main:test"
run_with_trigger          = "s01_data_collector_filter.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
