[project]
name = "gold-standard-studio"
version = "0.1.0"
description = "An isolated review tool for the Full-Database Golden Standard Studio."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pydantic>=2",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_standard_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
